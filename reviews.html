<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WALLFORM — Reviews</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      border-bottom: 1px solid #222;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .nav {
      display: flex;
      gap: 10px;
    }

    .nav a {
      text-decoration: none;
      color: #fff;
      border: 1px solid #444;
      padding: 9px 15px;
      font-size: 12px;
      font-weight: 700;
    }

    main {
      max-width: 950px;
      margin: 0 auto;
      padding: 55px 20px 80px;
    }

    .hero {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 25px;
      margin-bottom: 45px;
    }

    h1 {
      font-size: 52px;
      line-height: 1;
      margin: 0;
      letter-spacing: -3px;
    }

    .write-btn {
      border: 1px solid #fff;
      background: #fff;
      color: #000;
      padding: 14px 21px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .summary {
      border: 1px solid #222;
      padding: 25px;
      display: flex;
      align-items: center;
      gap: 25px;
      margin-bottom: 35px;
    }

    .average {
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
    }

    .stars {
      letter-spacing: 3px;
      font-size: 19px;
    }

    .review-count {
      color: #777;
      font-size: 12px;
      margin-top: 5px;
    }

    .review-card {
      border-bottom: 1px solid #222;
      padding: 27px 0;
    }

    .review-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 8px;
    }

    .reviewer {
      font-weight: 800;
      font-size: 14px;
    }

    .review-date {
      color: #666;
      font-size: 12px;
    }

    .review-stars {
      font-size: 17px;
      letter-spacing: 2px;
      margin-bottom: 11px;
    }

    .product {
      display: inline-block;
      border: 1px solid #333;
      padding: 5px 8px;
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .review-text {
      font-size: 14px;
      line-height: 1.65;
      color: #bbb;
      max-width: 700px;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      border: 1px solid #222;
      color: #666;
      font-size: 13px;
    }

    /* MODAL */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .overlay.active {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      background: #0a0a0a;
      border: 1px solid #292929;
      padding: 30px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .modal h2 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -1px;
    }

    .close {
      border: 0;
      background: none;
      color: #fff;
      font-size: 27px;
      cursor: pointer;
    }

    label {
      display: block;
      font-size: 10px;
      font-weight: 800;
      margin: 20px 0 8px;
      text-transform: uppercase;
      color: #aaa;
      letter-spacing: .5px;
    }

    select,
    input,
    textarea {
      width: 100%;
      border: 1px solid #333;
      background: #050505;
      color: #fff;
      padding: 13px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 130px;
    }

    .star-picker {
      display: flex;
      gap: 5px;
      margin-top: 5px;
    }

    .star {
      border: 0;
      background: none;
      padding: 0;
      font-size: 38px;
      color: #444;
      cursor: pointer;
      line-height: 1;
    }

    .star.selected {
      color: #fff;
    }

    .submit {
      width: 100%;
      border: 0;
      background: #fff;
      color: #000;
      padding: 15px;
      margin-top: 25px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit:disabled {
      opacity: .5;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      font-size: 12px;
      text-align: center;
    }

    .message.show {
      display: block;
    }

    .success {
      background: #fff;
      color: #000;
    }

    .error {
      border: 1px solid #333;
      color: #fff;
    }

    @media (max-width: 650px) {

      header {
        padding: 17px;
      }

      main {
        padding: 35px 15px 60px;
      }

      h1 {
        font-size: 40px;
      }

      .hero {
        display: block;
      }

      .write-btn {
        margin-top: 20px;
        width: 100%;
      }

      .summary {
        padding: 20px;
      }

      .modal {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">WALLFORM</div>

  <div class="nav">
    <a href="https://wallform.my.canva.site/shop">
      SHOP
    </a>
  </div>

</header>


<main>

  <section class="hero">

    <h1>REVIEWS</h1>

    <button
      class="write-btn"
      onclick="openReview()"
    >
      WRITE A REVIEW
    </button>

  </section>


  <section class="summary">

    <div
      class="average"
      id="average"
    >
      —
    </div>

    <div>

      <div
        class="stars"
        id="summaryStars"
      >
        ☆☆☆☆☆
      </div>

      <div
        class="review-count"
        id="reviewCount"
      >
        No reviews yet
      </div>

    </div>

  </section>


  <section id="reviews"></section>

</main>


<!-- REVIEW MODAL -->

<div
  class="overlay"
  id="overlay"
>

  <div class="modal">

    <div class="modal-head">

      <h2>WRITE A REVIEW</h2>

      <button
        class="close"
        onclick="closeReview()"
      >
        ×
      </button>

    </div>


    <form id="reviewForm">

      <label for="product">
        Product
      </label>

      <select
        id="product"
        required
      >

        <option value="">
          Choose a product
        </option>

        <option value="WF-002|Porsche 911 GT3RS Mini">
          Porsche 911 GT3RS Mini
        </option>

        <option value="WF-003|F1 Car Mini">
          F1 Car Mini
        </option>

        <option value="WF-004|Japanese Scenery Mini">
          Japanese Scenery Mini
        </option>

        <option value="WF-005|Vintage Race Car Mini">
          Vintage Race Car Mini
        </option>

        <option value="WF-006|Batmobile Mini">
          Batmobile Mini
        </option>

        <option value="WF-007|Check Engine Logo">
          Check Engine Logo
        </option>

        <option value="WF-008|Custom Name Plate">
          Custom Name Plate
        </option>

        <option value="WF-009|Custom Prints">
          Custom Prints
        </option>

      </select>


      <label>
        Rating
      </label>

      <div class="star-picker">

        <button
          type="button"
          class="star"
          data-rating="1"
        >☆</button>

        <button
          type="button"
          class="star"
          data-rating="2"
        >☆</button>

        <button
          type="button"
          class="star"
          data-rating="3"
        >☆</button>

        <button
          type="button"
          class="star"
          data-rating="4"
        >☆</button>

        <button
          type="button"
          class="star"
          data-rating="5"
        >☆</button>

      </div>


      <label for="name">
        Your name
      </label>

      <input
        id="name"
        maxlength="40"
        placeholder="Display name"
        required
      >


      <label for="reviewText">
        Review
      </label>

      <textarea
        id="reviewText"
        maxlength="1000"
        placeholder="Tell us what you think..."
        required
      ></textarea>


      <button
        class="submit"
        type="submit"
      >
        POST REVIEW
      </button>


      <div
        class="message"
        id="message"
      ></div>

    </form>

  </div>

</div>


<script>

  const SUPABASE_URL =
    "https://hfszmdfhornblrwxawmo.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_4Rs82e-VgvBAD4po3yyuJg_r6KFgoqJ";


  const db =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let selectedRating = 0;


  const overlay =
    document.getElementById("overlay");


  const stars =
    document.querySelectorAll(".star");


  function openReview() {

    overlay.classList.add("active");

  }


  function closeReview() {

    overlay.classList.remove("active");

  }


  overlay.addEventListener(
    "click",
    function(e) {

      if (e.target === overlay) {
        closeReview();
      }

    }
  );


  stars.forEach(star => {

    star.addEventListener(
      "click",
      function() {

        selectedRating =
          Number(this.dataset.rating);

        updateStars();

      }
    );

  });


  function updateStars() {

    stars.forEach(star => {

      const rating =
        Number(star.dataset.rating);


      if (rating <= selectedRating) {

        star.textContent = "★";

        star.classList.add("selected");

      } else {

        star.textContent = "☆";

        star.classList.remove("selected");

      }

    });

  }


  async function loadReviews() {

    const container =
      document.getElementById("reviews");


    const { data, error } =
      await db
        .from("reviews")
        .select("*")
        .order(
          "created_at",
          { ascending: false }
        );


    if (error) {

      container.innerHTML = `
        <div class="empty">
          Reviews are temporarily unavailable.
        </div>
      `;

      return;

    }


    if (!data || data.length === 0) {

      document.getElementById("average")
        .textContent = "—";

      document.getElementById("summaryStars")
        .textContent = "☆☆☆☆☆";

      document.getElementById("reviewCount")
        .textContent = "No reviews yet";


      container.innerHTML = `
        <div class="empty">
          No reviews yet.<br><br>
          Be the first.
        </div>
      `;

      return;

    }


    updateSummary(data);


    container.innerHTML =
      data.map(review => {

        const date =
          new Date(
            review.created_at
          ).toLocaleDateString(
            "en-IN",
            {
              day: "numeric",
              month: "short",
              year: "numeric"
            }
          );


        return `

          <article class="review-card">

            <div class="review-top">

              <div class="reviewer">
                ${escapeHTML(
                  review.reviewer_name
                )}
              </div>

              <div class="review-date">
                ${date}
              </div>

            </div>


            <div class="review-stars">
              ${"★".repeat(review.rating)}
              ${"☆".repeat(5 - review.rating)}
            </div>


            <div class="product">
              ${escapeHTML(
                review.product_name
              )}
            </div>


            <div class="review-text">
              ${escapeHTML(
                review.review_text
              )}
            </div>

          </article>

        `;

      }).join("");

  }


  function updateSummary(reviews) {

    if (!reviews.length) {
      return;
    }


    const average =
      reviews.reduce(
        (sum, review) =>
          sum + Number(review.rating),
        0
      ) / reviews.length;


    const rounded =
      Math.round(average);


    document.getElementById("average")
      .textContent =
        average.toFixed(1);


    document.getElementById("summaryStars")
      .textContent =
        "★".repeat(rounded) +
        "☆".repeat(5 - rounded);


    document.getElementById("reviewCount")
      .textContent =
        reviews.length === 1
          ? "1 review"
          : `${reviews.length} reviews`;

  }


  document
    .getElementById("reviewForm")
    .addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();


        if (!selectedRating) {

          showMessage(
            "Please select a rating.",
            "error"
          );

          return;

        }


        const productValue =
          document.getElementById(
            "product"
          ).value;


        if (!productValue) {

          showMessage(
            "Please choose a product.",
            "error"
          );

          return;

        }


        const [
          productCode,
          productName
        ] =
          productValue.split("|");


        const reviewerName =
          document.getElementById(
            "name"
          ).value.trim();


        const reviewText =
          document.getElementById(
            "reviewText"
          ).value.trim();


        const submitButton =
          document.querySelector(
            ".submit"
          );


        submitButton.disabled = true;

        submitButton.textContent =
          "POSTING...";


        const { error } =
          await db
            .from("reviews")
            .insert({

              product_code:
                productCode,

              product_name:
                productName,

              reviewer_name:
                reviewerName,

              rating:
                selectedRating,

              review_text:
                reviewText

            });


        submitButton.disabled = false;

        submitButton.textContent =
          "POST REVIEW";


        if (error) {

          showMessage(
            "Something went wrong. Please try again.",
            "error"
          );

          return;

        }


        showMessage(
          "✓ REVIEW POSTED",
          "success"
        );


        document
          .getElementById(
            "reviewForm"
          )
          .reset();


        selectedRating = 0;

        updateStars();


        setTimeout(() => {

          closeReview();

          loadReviews();

        }, 900);

      }
    );


  function showMessage(
    text,
    type
  ) {

    const message =
      document.getElementById(
        "message"
      );


    message.textContent = text;

    message.className =
      "message show " + type;

  }


  function escapeHTML(value) {

    return String(value || "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  loadReviews();

</script>

</body>
</html>
