<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Checkout — WALLFORM</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 30px 20px;
    }

    .checkout {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    .section {
      border: 1px solid #333;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section h2 {
      font-size: 18px;
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      background: #111;
      color: #fff;
      border: 1px solid #444;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #fff;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      background: #fff;
      color: #000;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
      color: #ccc;
    }

    .total {
      border-top: 1px solid #333;
      padding-top: 15px;
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
    }

    .error {
      color: #ff6b6b;
      margin-top: 12px;
      display: none;
    }

    .success {
      color: #7cff9b;
      margin-top: 12px;
      display: none;
    }

    #shippingBox {
      display: none;
    }

    .field-label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

  </style>

</head>


<body>


<div class="checkout">


  <h1>CHECKOUT</h1>


  <!-- =========================
       DELIVERY FORM
  ========================== -->

  <div class="section">

    <h2>Delivery Details</h2>


    <label class="field-label">
      FULL NAME
    </label>

    <input
      id="fullName"
      type="text"
      autocomplete="name"
      placeholder="Full name"
    >


    <label class="field-label">
      PHONE NUMBER
    </label>

    <input
      id="phone"
      type="tel"
      inputmode="numeric"
      maxlength="10"
      autocomplete="tel"
      placeholder="10-digit phone number"
    >


    <label class="field-label">
      HOUSE / FLAT / BUILDING
    </label>

    <input
      id="house"
      type="text"
      autocomplete="street-address"
      placeholder="House / Flat / Building"
    >


    <label class="field-label">
      STREET / ROAD
    </label>

    <input
      id="street"
      type="text"
      placeholder="Street / Road"
    >


    <label class="field-label">
      AREA / LOCALITY
    </label>

    <input
      id="area"
      type="text"
      placeholder="Area / Locality"
    >


    <label class="field-label">
      CITY
    </label>

    <input
      id="city"
      type="text"
      autocomplete="address-level2"
      placeholder="City"
    >


    <label class="field-label">
      STATE
    </label>

    <input
      id="state"
      type="text"
      autocomplete="address-level1"
      placeholder="State"
    >


    <label class="field-label">
      PIN CODE
    </label>

    <input
      id="pin"
      type="text"
      inputmode="numeric"
      maxlength="6"
      autocomplete="postal-code"
      placeholder="6-digit PIN code"
    >


    <button
      id="calculateBtn"
      onclick="calculateShipping()"
    >
      CALCULATE SHIPPING
    </button>


    <div
      id="error"
      class="error"
    ></div>

  </div>



  <!-- =========================
       ORDER SUMMARY
  ========================== -->

  <div
    id="shippingBox"
    class="section"
  >

    <h2>Order Summary</h2>


    <div class="row">

      <span>
        Products
      </span>

      <span id="productsTotal">
        ₹0
      </span>

    </div>


    <div class="row">

      <span>
        Shipping
      </span>

      <span id="shippingTotal">
        ₹0
      </span>

    </div>


    <div class="row total">

      <span>
        Total
      </span>

      <span id="grandTotal">
        ₹0
      </span>

    </div>


    <button
      onclick="placeOrder()"
    >
      PLACE ORDER
    </button>


    <div
      id="success"
      class="success"
    >
      Opening WhatsApp...
    </div>

  </div>


</div>



<script>


/* =========================
   WORKER
========================= */

const WORKER_URL =
  "https://wallformworker.edararampranav.workers.dev/";



/* =========================
   PRODUCTS
========================= */

const products = {

  "WF-001": {
    name: "Porsche 911 GT3 RS",
    price: 69
  },

  "WF-002": {
    name: "F1 Car",
    price: 89
  },

  "WF-003": {
    name: "Japanese Scenery",
    price: 89
  },

  "WF-004": {
    name: "Vintage Race Car",
    price: 79
  },

  "WF-005": {
    name: "Batmobile",
    price: 89
  },

  "WF-006": {
    name: "Check Engine Logo",
    price: 149
  }

};



let shippingPrice = 0;

let currentCart = {};



/* =========================
   GET CART
========================= */

function getCart() {

  try {

    const saved =
      localStorage.getItem("wallformCart");


    if (!saved) {
      return {};
    }


    const parsed =
      JSON.parse(saved);


    if (
      parsed &&
      typeof parsed === "object"
    ) {

      return parsed;

    }


    return {};

  } catch (error) {

    return {};

  }

}



/* =========================
   PRODUCTS TOTAL
========================= */

function calculateProductsTotal() {

  currentCart =
    getCart();


  let total = 0;


  for (
    const code in currentCart
  ) {

    if (!products[code]) {
      continue;
    }


    const quantity =
      Number(currentCart[code]) || 0;


    total +=
      products[code].price *
      quantity;

  }


  return total;

}



/* =========================
   CALCULATE SHIPPING
========================= */

async function calculateShipping() {


  const fullName =
    document
      .getElementById("fullName")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const house =
    document
      .getElementById("house")
      .value
      .trim();


  const street =
    document
      .getElementById("street")
      .value
      .trim();


  const area =
    document
      .getElementById("area")
      .value
      .trim();


  const city =
    document
      .getElementById("city")
      .value
      .trim();


  const state =
    document
      .getElementById("state")
      .value
      .trim();


  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  const error =
    document.getElementById("error");


  const button =
    document.getElementById(
      "calculateBtn"
    );


  error.style.display =
    "none";


  /* =========================
     VALIDATE FORM
  ========================== */

  if (!fullName) {

    showError(
      "Please enter your full name."
    );

    return;

  }


  if (!/^\d{10}$/.test(phone)) {

    showError(
      "Please enter a valid 10-digit phone number."
    );

    return;

  }


  if (!house) {

    showError(
      "Please enter your house, flat or building."
    );

    return;

  }


  if (!street) {

    showError(
      "Please enter your street or road."
    );

    return;

  }


  if (!area) {

    showError(
      "Please enter your area or locality."
    );

    return;

  }


  if (!city) {

    showError(
      "Please enter your city."
    );

    return;

  }


  if (!state) {

    showError(
      "Please enter your state."
    );

    return;

  }


  if (!/^\d{6}$/.test(pin)) {

    showError(
      "Please enter a valid 6-digit PIN code."
    );

    return;

  }


  /* =========================
     DISABLE BUTTON
  ========================== */

  button.disabled =
    true;

  button.textContent =
    "CALCULATING...";


  try {


    /* =========================
       SEND PIN TO WORKER
    ========================== */

    const response =
      await fetch(
        WORKER_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              destination: pin
            })

        }
      );


    const result =
      await response.json();


    if (!response.ok) {

      throw new Error(
        result.error ||
        "Unable to calculate shipping."
      );

    }


    if (
      !result.data ||
      result.data.total == null
    ) {

      throw new Error(
        "Postpin did not return a shipping price."
      );

    }


    /* =========================
       SAVE SHIPPING
    ========================== */

    shippingPrice =
      Number(
        result.data.total
      );


    /* =========================
       CALCULATE TOTALS
    ========================== */

    const productsTotal =
      calculateProductsTotal();


    const grandTotal =
      productsTotal +
      shippingPrice;


    document
      .getElementById(
        "productsTotal"
      )
      .textContent =
      "₹" +
      productsTotal.toFixed(2);


    document
      .getElementById(
        "shippingTotal"
      )
      .textContent =
      "₹" +
      shippingPrice.toFixed(2);


    document
      .getElementById(
        "grandTotal"
      )
      .textContent =
      "₹" +
      grandTotal.toFixed(2);


    /* =========================
       SHOW SUMMARY
    ========================== */

    document
      .getElementById(
        "shippingBox"
      )
      .style.display =
      "block";


    document
      .getElementById(
        "shippingBox"
      )
      .scrollIntoView({

        behavior: "smooth",

        block: "start"

      });


  } catch (error) {


    showError(
      error.message
    );

  }


  button.disabled =
    false;

  button.textContent =
    "CALCULATE SHIPPING";

}



/* =========================
   ERROR
========================= */

function showError(message) {

  const error =
    document.getElementById(
      "error"
    );


  error.textContent =
    message;


  error.style.display =
    "block";


}



/* =========================
   PLACE ORDER
========================= */

function placeOrder() {


  /*
    Make absolutely sure
    shipping was calculated.
  */

  if (
    shippingPrice <= 0
  ) {

    showError(
      "Please calculate shipping first."
    );

    return;

  }


  /* =========================
     GET FORM DETAILS
  ========================== */

  const fullName =
    document
      .getElementById("fullName")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const house =
    document
      .getElementById("house")
      .value
      .trim();


  const street =
    document
      .getElementById("street")
      .value
      .trim();


  const area =
    document
      .getElementById("area")
      .value
      .trim();


  const city =
    document
      .getElementById("city")
      .value
      .trim();


  const state =
    document
      .getElementById("state")
      .value
      .trim();


  const pin =
    document
      .getElementById("pin")
      .value
      .trim();



  /* =========================
     FINAL VALIDATION
  ========================== */

  if (!fullName ||
      !phone ||
      !house ||
      !street ||
      !area ||
      !city ||
      !state ||
      !/^\d{6}$/.test(pin)
  ) {

    showError(
      "Please complete all delivery details."
    );

    return;

  }


  if (!/^\d{10}$/.test(phone)) {

    showError(
      "Please enter a valid 10-digit phone number."
    );

    return;

  }



  /* =========================
     TOTALS
  ========================== */

  const productsTotal =
    calculateProductsTotal();


  const grandTotal =
    productsTotal +
    shippingPrice;



  /* =========================
     WHATSAPP MESSAGE
  ========================== */

  let message =
    "Hi WALLFORM! I'd like to place an order:%0A%0A";


  message +=
    "ORDER%0A";


  for (
    const code in currentCart
  ) {


    if (!products[code]) {
      continue;
    }


    const quantity =
      Number(
        currentCart[code]
      ) || 0;


    if (quantity <= 0) {
      continue;
    }


    message +=
      encodeURIComponent(
        products[code].name
      ) +
      " (" +
      code +
      ") × " +
      quantity +
      "%0A";

  }



  /* =========================
     PRICE DETAILS
  ========================== */

  message +=
    "%0AProducts: ₹" +
    productsTotal.toFixed(2);


  message +=
    "%0AShipping: ₹" +
    shippingPrice.toFixed(2);


  message +=
    "%0ATotal: ₹" +
    grandTotal.toFixed(2);



  /* =========================
   FORMATTED DELIVERY ADDRESS
========================= */

message +=
  "%0A%0ADELIVERY DETAILS%0A";

message +=
  "Name: " +
  encodeURIComponent(fullName) +
  "%0A";

message +=
  "Phone: " +
  encodeURIComponent(phone) +
  "%0A";

const formattedAddress =
  house +
  ", " +
  street +
  ", " +
  area +
  ", " +
  city +
  ", " +
  state +
  " - " +
  pin;

message +=
  "DELIVERY ADDRESS: " +
  encodeURIComponent(formattedAddress);

message +=
  "%0A%0APlease confirm the order and payment details.";


  /* =========================
     OPEN WHATSAPP
  ========================== */

  document
    .getElementById(
      "success"
    )
    .style.display =
    "block";


  window.location.href =
    "https://wa.me/918500670741?text=" +
    message;

}


</script>


</body>

</html>
