<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Checkout — WALLFORM</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background: #000;

      color: #fff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      padding: 30px 20px;

    }


    .checkout {

      max-width: 600px;

      margin: auto;

    }


    h1 {

      font-size: 32px;

      margin-bottom: 30px;

    }


    .section {

      border: 1px solid #333;

      padding: 20px;

      margin-bottom: 20px;

    }


    .section h2 {

      font-size: 18px;

      margin-top: 0;

    }


    input,
    select {

      width: 100%;

      padding: 14px;

      margin-bottom: 12px;

      background: #111;

      color: #fff;

      border: 1px solid #444;

      font-size: 16px;

      outline: none;

    }


    input:focus,
    select:focus {

      border-color: #fff;

    }


    button {

      width: 100%;

      padding: 15px;

      margin-top: 12px;

      border: none;

      background: #fff;

      color: #000;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

    }


    button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

    }


    .row {

      display: flex;

      justify-content: space-between;

      margin: 12px 0;

      color: #ccc;

    }


    .total {

      border-top: 1px solid #333;

      padding-top: 15px;

      margin-top: 15px;

      font-size: 20px;

      font-weight: bold;

      color: #fff;

    }


    .error {

      color: #ff6b6b;

      margin-top: 12px;

      display: none;

    }


    .success {

      color: #7cff9b;

      margin-top: 12px;

      display: none;

    }


    #shippingBox {

      display: none;

    }


    #addressBox {

      display: none;

    }


    .field-label {

      display: block;

      font-size: 12px;

      color: #888;

      margin-bottom: 6px;

      letter-spacing: 0.5px;

    }

  </style>

</head>


<body>


<div class="checkout">


  <h1>CHECKOUT</h1>


  <!-- =========================
       SHIPPING
  ========================== -->

  <div class="section">


    <h2>
      Delivery PIN Code
    </h2>


    <span class="field-label">
      Enter the PIN where the order will be delivered
    </span>


    <input
      id="pin"
      type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="6-digit PIN code"
    >


    <button
      id="calculateBtn"
      onclick="calculateShipping()">

      CALCULATE SHIPPING

    </button>


    <div
      id="error"
      class="error">
    </div>


  </div>



  <!-- =========================
       ADDRESS
  ========================== -->

  <div
    id="addressBox"
    class="section">


    <h2>
      Delivery Details
    </h2>


    <label class="field-label">
      FULL NAME
    </label>

    <input
      id="fullName"
      type="text"
      autocomplete="name"
      placeholder="Full name"
    >


    <label class="field-label">
      PHONE NUMBER
    </label>

    <input
      id="phone"
      type="tel"
      inputmode="tel"
      autocomplete="tel"
      placeholder="10-digit phone number"
    >


    <label class="field-label">
      HOUSE / FLAT / BUILDING
    </label>

    <input
      id="house"
      type="text"
      autocomplete="street-address"
      placeholder="House / Flat / Building number"
    >


    <label class="field-label">
      STREET / ROAD
    </label>

    <input
      id="street"
      type="text"
      placeholder="Street / Road"
    >


    <label class="field-label">
      AREA / LOCALITY
    </label>

    <input
      id="area"
      type="text"
      placeholder="Area / Locality"
    >


    <label class="field-label">
      CITY
    </label>

    <input
      id="city"
      type="text"
      autocomplete="address-level2"
      placeholder="City"
    >


    <label class="field-label">
      STATE
    </label>

    <input
      id="state"
      type="text"
      autocomplete="address-level1"
      placeholder="State"
    >


    <button
      onclick="showOrderSummary()">

      CONTINUE

    </button>


  </div>



  <!-- =========================
       ORDER SUMMARY
  ========================== -->

  <div
    id="shippingBox"
    class="section">


    <h2>
      Order Summary
    </h2>


    <div class="row">

      <span>
        Products
      </span>

      <span id="productsTotal">
        ₹0
      </span>

    </div>


    <div class="row">

      <span>
        Shipping
      </span>

      <span id="shippingTotal">
        ₹0
      </span>

    </div>


    <div class="row total">

      <span>
        Total
      </span>

      <span id="grandTotal">
        ₹0
      </span>

    </div>


    <button
      onclick="placeOrder()">

      PLACE ORDER

    </button>


    <div
      id="success"
      class="success">

      Opening WhatsApp...

    </div>


  </div>


</div>



<script>


/* =========================
   WORKER
========================= */

const WORKER_URL =
  "https://wallformworker.edararampranav.workers.dev/";



/* =========================
   PRODUCTS
========================= */

const products = {

  "WF-001": {
    name: "Porsche 911 GT3 RS",
    price: 69
  },

  "WF-002": {
    name: "F1 Car",
    price: 89
  },

  "WF-003": {
    name: "Japanese Scenery",
    price: 89
  },

  "WF-004": {
    name: "Vintage Race Car",
    price: 79
  },

  "WF-005": {
    name: "Batmobile",
    price: 89
  },

  "WF-006": {
    name: "Check Engine Logo",
    price: 149
  }

};



let shippingPrice = 0;

let currentCart = {};

let deliveryDetails = {};



/* =========================
   GET CART
========================= */

function getCart() {

  try {

    const saved =
      localStorage.getItem("wallformCart");


    if (!saved) {
      return {};
    }


    const parsed =
      JSON.parse(saved);


    if (
      parsed &&
      typeof parsed === "object"
    ) {

      return parsed;

    }


    return {};

  } catch (error) {

    return {};

  }

}



/* =========================
   PRODUCTS TOTAL
========================= */

function calculateProductsTotal() {

  currentCart =
    getCart();


  let total = 0;


  for (
    const code in currentCart
  ) {


    if (!products[code]) {
      continue;
    }


    const quantity =
      Number(currentCart[code]) || 0;


    total +=
      products[code].price *
      quantity;

  }


  return total;

}



/* =========================
   SHIPPING
========================= */

async function calculateShipping() {


  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  const error =
    document.getElementById("error");


  const button =
    document.getElementById(
      "calculateBtn"
    );


  error.style.display =
    "none";


  if (!/^\d{6}$/.test(pin)) {

    error.textContent =
      "Please enter a valid 6-digit PIN code.";

    error.style.display =
      "block";

    return;

  }


  button.disabled =
    true;


  button.textContent =
    "CALCULATING...";


  try {


    const response =
      await fetch(
        WORKER_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              destination: pin

            })

        }
      );


    const result =
      await response.json();


    if (!response.ok) {

      throw new Error(
        result.error ||
        "Unable to calculate shipping."
      );

    }


    if (
      !result.data ||
      result.data.total == null
    ) {

      throw new Error(
        "Postpin did not return a shipping price."
      );

    }


    shippingPrice =
      Number(
        result.data.total
      );


    const productsTotal =
      calculateProductsTotal();


    const grandTotal =
      productsTotal +
      shippingPrice;



    document
      .getElementById(
        "productsTotal"
      )
      .textContent =
      "₹" +
      productsTotal.toFixed(2);


    document
      .getElementById(
        "shippingTotal"
      )
      .textContent =
      "₹" +
      shippingPrice.toFixed(2);


    document
      .getElementById(
        "grandTotal"
      )
      .textContent =
      "₹" +
      grandTotal.toFixed(2);


    /*
      Only reveal the address form
      after shipping has been calculated.
    */

    document
      .getElementById(
        "addressBox"
      )
      .style.display =
      "block";


  } catch (error) {


    document
      .getElementById("error")
      .textContent =
      error.message;


    document
      .getElementById("error")
      .style.display =
      "block";


  }


  button.disabled =
    false;


  button.textContent =
    "CALCULATE SHIPPING";

}



/* =========================
   ADDRESS VALIDATION
========================= */

function showOrderSummary() {


  const fullName =
    document
      .getElementById("fullName")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const house =
    document
      .getElementById("house")
      .value
      .trim();


  const street =
    document
      .getElementById("street")
      .value
      .trim();


  const area =
    document
      .getElementById("area")
      .value
      .trim();


  const city =
    document
      .getElementById("city")
      .value
      .trim();


  const state =
    document
      .getElementById("state")
      .value
      .trim();


  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  const error =
    document.getElementById("error");


  error.style.display =
    "none";


  /* =========================
     REQUIRED FIELDS
  ========================== */

  if (!fullName) {

    showError(
      "Please enter your full name."
    );

    return;

  }


  if (!/^\d{10}$/.test(phone)) {

    showError(
      "Please enter a valid 10-digit phone number."
    );

    return;

  }


  if (!house) {

    showError(
      "Please enter your house, flat or building number."
    );

    return;

  }


  if (!street) {

    showError(
      "Please enter your street or road."
    );

    return;

  }


  if (!area) {

    showError(
      "Please enter your area or locality."
    );

    return;

  }


  if (!city) {

    showError(
      "Please enter your city."
    );

    return;

  }


  if (!state) {

    showError(
      "Please enter your state."
    );

    return;

  }


  if (!/^\d{6}$/.test(pin)) {

    showError(
      "Please enter a valid 6-digit PIN code."
    );

    return;

  }


  /* =========================
     SAVE DETAILS
  ========================== */

  deliveryDetails = {

    fullName: fullName,

    phone: phone,

    house: house,

    street: street,

    area: area,

    city: city,

    state: state,

    pin: pin

  };


  /*
    Keep the existing summary visible.
    Nothing else changes here.
  */

  document
    .getElementById(
      "shippingBox"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "shippingBox"
    )
    .scrollIntoView({

      behavior: "smooth",

      block: "start"

    });

}



/* =========================
   ERROR
========================= */

function showError(message) {

  const error =
    document.getElementById(
      "error"
    );


  error.textContent =
    message;


  error.style.display =
    "block";


  error.scrollIntoView({

    behavior: "smooth",

    block: "center"

  });

}



/* =========================
   PLACE ORDER
========================= */

function placeOrder() {


  /*
    Make sure the customer has
    filled the address first.
  */

  if (
    !deliveryDetails.fullName
  ) {

    showError(
      "Please complete your delivery details first."
    );

    return;

  }



  const productsTotal =
    calculateProductsTotal();


  const grandTotal =
    productsTotal +
    shippingPrice;



  /*
    Start WhatsApp message.
  */

  let message =
    "Hi WALLFORM! I'd like to place an order.%0A%0A";



  /* =========================
     ORDER
  ========================== */

  message +=
    "*ORDER*%0A";


  for (
    const code in currentCart
  ) {


    if (!products[code]) {
      continue;
    }


    const quantity =
      Number(
        currentCart[code]
      ) || 0;


    if (quantity <= 0) {
      continue;
    }


    message +=
      products[code].name +
      " (" +
      code +
      ") × " +
      quantity +
      "%0A";

  }



  /* =========================
     PRICE
  ========================== */

  message +=
    "%0AProducts: ₹" +
    productsTotal.toFixed(2);


  message +=
    "%0AShipping: ₹" +
    shippingPrice.toFixed(2);


  message +=
    "%0A*Total: ₹" +
    grandTotal.toFixed(2);



  /* =========================
     DELIVERY DETAILS
  ========================== */

  message +=
    "%0A%0A*DELIVERY DETAILS*";


  message +=
    "%0AName: " +
    encodeURIComponent(
      deliveryDetails.fullName
    );


  message +=
    "%0APhone: " +
    encodeURIComponent(
      deliveryDetails.phone
    );


  message +=
    "%0AHouse/Flat/Building: " +
    encodeURIComponent(
      deliveryDetails.house
    );


  message +=
    "%0AStreet/Road: " +
    encodeURIComponent(
      deliveryDetails.street
    );


  message +=
    "%0AArea/Locality: " +
    encodeURIComponent(
      deliveryDetails.area
    );


  message +=
    "%0ACity: " +
    encodeURIComponent(
      deliveryDetails.city
    );


  message +=
    "%0AState: " +
    encodeURIComponent(
      deliveryDetails.state
    );


  message +=
    "%0APIN: " +
    encodeURIComponent(
      deliveryDetails.pin
    );



  message +=
    "%0A%0APlease confirm the order and payment details.";



  /*
    Show confirmation text.
  */

  document
    .getElementById(
      "success"
    )
    .style.display =
    "block";



  /*
    Open WhatsApp.
  */

  window.location.href =
    "https://wa.me/918500670741?text=" +
    message;

}


</script>


</body>

</html>
