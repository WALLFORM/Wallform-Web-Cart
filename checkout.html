<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Checkout — WALLFORM</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background: #000;

      color: #fff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      padding: 30px 20px;

    }


    .checkout {

      max-width: 600px;

      margin: auto;

    }


    h1 {

      font-size: 32px;

      margin-bottom: 30px;

    }


    .section {

      border: 1px solid #333;

      padding: 20px;

      margin-bottom: 20px;

    }


    .section h2 {

      font-size: 18px;

      margin-top: 0;

    }


    input {

      width: 100%;

      padding: 14px;

      margin-bottom: 12px;

      background: #111;

      color: #fff;

      border: 1px solid #444;

      font-size: 16px;

      outline: none;

    }


    input:focus {

      border-color: #fff;

    }


    button {

      width: 100%;

      padding: 15px;

      margin-top: 12px;

      border: none;

      background: #fff;

      color: #000;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

    }


    button:hover {

      background: #ddd;

    }


    .row {

      display: flex;

      justify-content: space-between;

      gap: 20px;

      margin: 12px 0;

      color: #ccc;

    }


    .total {

      border-top: 1px solid #333;

      padding-top: 15px;

      margin-top: 15px;

      font-size: 20px;

      font-weight: bold;

      color: #fff;

    }


    .error {

      color: #ff6b6b;

      margin-top: 12px;

      display: none;

    }


    .success {

      color: #7cff9b;

      margin-top: 12px;

      display: none;

    }


    #shippingBox {

      display: none;

    }


    .shipping-note {

      color: #888;

      font-size: 13px;

      line-height: 1.5;

      margin-top: 15px;

    }


    .field-label {

      display: block;

      font-size: 12px;

      color: #888;

      margin-bottom: 6px;

      letter-spacing: 0.5px;

    }


    @media (max-width: 500px) {

      .row {

        align-items: flex-start;

      }


      .row span:last-child {

        text-align: right;

      }

    }

  </style>

</head>


<body>


<div class="checkout">


  <h1>CHECKOUT</h1>


  <!-- =========================
       DELIVERY DETAILS
  ========================== -->

  <div class="section">

    <h2>Delivery Details</h2>


    <label class="field-label">
      FULL NAME
    </label>

    <input
      id="fullName"
      type="text"
      autocomplete="name"
      placeholder="Full name"
    >


    <label class="field-label">
      PHONE NUMBER
    </label>

    <input
      id="phone"
      type="tel"
      inputmode="numeric"
      maxlength="10"
      autocomplete="tel"
      placeholder="10-digit phone number"
    >


    <label class="field-label">
      HOUSE / FLAT / BUILDING
    </label>

    <input
      id="house"
      type="text"
      autocomplete="street-address"
      placeholder="House / Flat / Building"
    >


    <label class="field-label">
      STREET / ROAD
    </label>

    <input
      id="street"
      type="text"
      placeholder="Street / Road"
    >


    <label class="field-label">
      AREA / LOCALITY
    </label>

    <input
      id="area"
      type="text"
      placeholder="Area / Locality"
    >


    <label class="field-label">
      CITY
    </label>

    <input
      id="city"
      type="text"
      autocomplete="address-level2"
      placeholder="City"
    >


    <label class="field-label">
      STATE
    </label>

    <input
      id="state"
      type="text"
      autocomplete="address-level1"
      placeholder="State"
    >


    <label class="field-label">
      PIN CODE
    </label>

    <input
      id="pin"
      type="text"
      inputmode="numeric"
      maxlength="6"
      autocomplete="postal-code"
      placeholder="6-digit PIN code"
    >


    <button
      id="continueBtn"
      onclick="continueToOrder()"
    >
      CONTINUE
    </button>


    <div
      id="error"
      class="error"
    ></div>

  </div>



  <!-- =========================
       ORDER SUMMARY
  ========================== -->

  <div
    id="shippingBox"
    class="section"
  >

    <h2>Order Summary</h2>


    <div class="row">

      <span>
        Products
      </span>

      <span id="productsTotal">
        ₹0
      </span>

    </div>


    <div class="row">

      <span>
        Shipping
      </span>

      <span id="shippingTotal">
        To be confirmed
      </span>

    </div>


    <div class="row total">

      <span>
        Total
      </span>

      <span id="grandTotal">
        ₹0
      </span>

    </div>


    <div class="shipping-note">
      Shipping charges will be calculated manually and confirmed with you on WhatsApp before payment.
    </div>


    <button
      onclick="placeOrder()"
    >
      PLACE ORDER
    </button>


    <div
      id="success"
      class="success"
    >
      Opening WhatsApp...
    </div>

  </div>


</div>



<script>


/* =========================
   PRODUCTS
========================= */

const products = {

  "WF-001": {
    name: "Porsche 911 GT3RS Mini",
    price: 99
  },

  "WF-002": {
    name: "F1 Car Mini",
    price: 99
  },

  "WF-003": {
    name: "Japanese Scenery Mini",
    price: 99
  },

  "WF-004": {
    name: "Vintage Race Car Mini",
    price: 99
  },

  "WF-005": {
    name: "Batmobile Mini",
    price: 99
  },

  "WF-006": {
    name: "Check Engine Logo",
    price: 119
  },

  "WF-007": {
    name: "Custom Name Plate",
    price: 149
  },

  "WF-008": {
    name: "Custom Prints",
    price: 220
  }

};



let currentCart = {};



/* =========================
   GET CART
========================= */

function getCart() {

  try {

    const saved =
      localStorage.getItem(
        "wallformCart"
      );


    if (!saved) {

      return {};

    }


    const parsed =
      JSON.parse(saved);


    if (
      parsed &&
      typeof parsed === "object"
    ) {

      return parsed;

    }


    return {};

  } catch (error) {

    return {};

  }

}



/* =========================
   GET COLORS
========================= */

function getColors() {

  try {

    const saved =
      localStorage.getItem(
        "wallformColors"
      );


    if (!saved) {

      return {};

    }


    const parsed =
      JSON.parse(saved);


    if (
      parsed &&
      typeof parsed === "object"
    ) {

      return parsed;

    }


    return {};

  } catch (error) {

    return {};

  }

}



/* =========================
   PRODUCTS TOTAL
========================= */

function calculateProductsTotal() {

  currentCart =
    getCart();


  let total = 0;


  for (
    const code in currentCart
  ) {

    if (!products[code]) {

      continue;

    }


    const quantity =
      Number(
        currentCart[code]
      ) || 0;


    total +=
      products[code].price *
      quantity;

  }


  return total;

}



/* =========================
   VALIDATE + CONTINUE
========================= */

function continueToOrder() {

  const fullName =
    document
      .getElementById("fullName")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const house =
    document
      .getElementById("house")
      .value
      .trim();


  const street =
    document
      .getElementById("street")
      .value
      .trim();


  const area =
    document
      .getElementById("area")
      .value
      .trim();


  const city =
    document
      .getElementById("city")
      .value
      .trim();


  const state =
    document
      .getElementById("state")
      .value
      .trim();


  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  const error =
    document.getElementById("error");


  error.style.display =
    "none";


  /* =========================
     VALIDATION
  ========================== */

  if (!fullName) {

    showError(
      "Please enter your full name."
    );

    return;

  }


  if (!/^\d{10}$/.test(phone)) {

    showError(
      "Please enter a valid 10-digit phone number."
    );

    return;

  }


  if (!house) {

    showError(
      "Please enter your house, flat or building."
    );

    return;

  }


  if (!street) {

    showError(
      "Please enter your street or road."
    );

    return;

  }


  if (!area) {

    showError(
      "Please enter your area or locality."
    );

    return;

  }


  if (!city) {

    showError(
      "Please enter your city."
    );

    return;

  }


  if (!state) {

    showError(
      "Please enter your state."
    );

    return;

  }


  if (!/^\d{6}$/.test(pin)) {

    showError(
      "Please enter a valid 6-digit PIN code."
    );

    return;

  }


  /* =========================
     TOTAL
  ========================== */

  const productsTotal =
    calculateProductsTotal();


  const checkoutData = {

    fullName:
      fullName,

    phone:
      phone,

    house:
      house,

    street:
      street,

    area:
      area,

    city:
      city,

    state:
      state,

    pin:
      pin,

    shippingPrice:
      null,

    productsTotal:
      productsTotal,

    grandTotal:
      productsTotal

  };


  localStorage.setItem(
    "wallformCheckoutData",
    JSON.stringify(
      checkoutData
    )
  );


  /* =========================
     SHOW SUMMARY
  ========================== */

  document
    .getElementById("productsTotal")
    .textContent =
    "₹" +
    productsTotal.toFixed(2);


  document
    .getElementById("shippingTotal")
    .textContent =
    "To be confirmed";


  document
    .getElementById("grandTotal")
    .textContent =
    "₹" +
    productsTotal.toFixed(2);


  document
    .getElementById("shippingBox")
    .style.display =
    "block";


  document
    .getElementById("shippingBox")
    .scrollIntoView({

      behavior: "smooth",

      block: "start"

    });

}



/* =========================
   ERROR
========================= */

function showError(message) {

  const error =
    document.getElementById(
      "error"
    );


  error.textContent =
    message;


  error.style.display =
    "block";

}



/* =========================
   PLACE ORDER
========================= */

function placeOrder() {

  const checkoutData =
    JSON.parse(
      localStorage.getItem(
        "wallformCheckoutData"
      ) || "{}"
    );


  if (
    !checkoutData.fullName
  ) {

    showError(
      "Please complete your delivery details first."
    );

    return;

  }


  openWhatsAppOrder();

}



/* =========================
   WHATSAPP ORDER
========================= */

function openWhatsAppOrder() {

  const checkoutData =
    JSON.parse(
      localStorage.getItem(
        "wallformCheckoutData"
      ) || "{}"
    );


  const cart =
    getCart();


  const colors =
    getColors();


  const customData =
    JSON.parse(
      localStorage.getItem(
        "wallformCustomData"
      ) || "{}"
    );


  const productsTotal =
    Number(
      checkoutData.productsTotal
    ) || 0;


  let message =
    "WALLFORM ORDER\n\n";


  /* =========================
     CUSTOMER DETAILS
  ========================== */

  message +=
    "━━━━━━━━━━━━━━━━━━\n" +
    "CUSTOMER DETAILS\n" +
    "━━━━━━━━━━━━━━━━━━\n";


  message +=
    "Name: " +
    checkoutData.fullName +
    "\n";


  message +=
    "Phone: " +
    checkoutData.phone +
    "\n";


  const formattedAddress =
    checkoutData.house +
    ", " +
    checkoutData.street +
    ", " +
    checkoutData.area +
    ", " +
    checkoutData.city +
    ", " +
    checkoutData.state +
    " - " +
    checkoutData.pin;


  message +=
    "Address: " +
    formattedAddress +
    "\n\n";


  /* =========================
     ORDER
  ========================== */

  message +=
    "━━━━━━━━━━━━━━━━━━\n" +
    "ORDER\n" +
    "━━━━━━━━━━━━━━━━━━\n";


  for (
    const code in cart
  ) {

    if (!products[code]) {

      continue;

    }


    const quantity =
      Number(
        cart[code]
      ) || 0;


    if (quantity <= 0) {

      continue;

    }


    const color =
      colors[code] ||
      "Black";


    const itemTotal =
      products[code].price *
      quantity;


    message +=
      quantity +
      " × " +
      products[code].name +
      " (" +
      code +
      ")\n";


    message +=
      "Color: " +
      color +
      " — ₹" +
      itemTotal.toFixed(2) +
      "\n";


    /* =========================
       CUSTOM NAME PLATE
    ========================== */

    if (
      code === "WF-007" &&
      customData.namePlate
    ) {

      const names =
        Array.isArray(
          customData.namePlate.names
        )
          ? customData.namePlate.names
          : [];


      const requests =
        customData.namePlate.requests ||
        "";


      if (names.length > 0) {

  names.forEach(function(name, index) {

    message +=
      "NAME " +
      (index + 1) +
      ": " +
      name +
      "\n";

  });

}

      if (requests.trim()) {

        message +=
          "Requested Mods: " +
          requests.trim() +
          "\n";

      }

    }


    /* =========================
       CUSTOM PRINT
    ========================== */

    if (
      code === "WF-008" &&
      customData.customPrint
    ) {

      const requests =
        customData.customPrint.requests ||
        "";


      if (requests.trim()) {

        message +=
          "Requested Mods: " +
          requests.trim() +
          "\n";

      }

    }


    message += "\n";

  }


  /* =========================
     PRICE DETAILS
  ========================== */

  message +=
    "Products Total: ₹" +
    productsTotal.toFixed(2);


  message +=
    "\nShipping: To be confirmed on WhatsApp";


  message +=
    "\nTOTAL BEFORE SHIPPING: ₹" +
    productsTotal.toFixed(2);


  message +=
    "\n\nPlease confirm the final shipping cost and order details.";


  /* =========================
     SHOW STATUS
  ========================== */

  document
    .getElementById("success")
    .style.display =
    "block";


  /* =========================
     OPEN WHATSAPP
  ========================== */

  window.location.href =
    "https://wa.me/918522070741?text=" +
    encodeURIComponent(
      message
    );

}


</script>


</body>

</html>
