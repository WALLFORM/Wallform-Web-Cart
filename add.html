<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WALLFORM</title>
</head>

<body>

<p>Adding to cart...</p>

<script>

const params =
  new URLSearchParams(window.location.search);

const code =
  params.get("add");


const validProducts = [
  "WF-001",
  "WF-002",
  "WF-003",
  "WF-004"
];


/* =========================
   GET CART
========================= */

function getCart() {

  try {

    const saved =
      localStorage.getItem("wallformCart");

    if (!saved) {
      return {};
    }

    const parsed =
      JSON.parse(saved);


    /* Convert old array format */

    if (Array.isArray(parsed)) {

      const converted = {};

      parsed.forEach(item => {

        converted[item] =
          (converted[item] || 0) + 1;

      });

      return converted;
    }


    return (
      parsed &&
      typeof parsed === "object"
    )
      ? parsed
      : {};

  } catch (error) {

    return {};

  }

}


/* =========================
   SAVE CART
========================= */

function saveCart(cart) {

  try {

    localStorage.setItem(
      "wallformCart",
      JSON.stringify(cart)
    );

  } catch (error) {

    // Storage unavailable

  }

}


/* =========================
   ADD PRODUCT
========================= */

if (validProducts.includes(code)) {

  const cart =
    getCart();


  cart[code] =
    (Number(cart[code]) || 0) + 1;


  saveCart(cart);

}


/* =========================
   RETURN TO ORIGINAL PAGE
========================= */

/*
  document.referrer contains the Canva
  page the customer came from.

  This means:
  Product page → Add to Cart
  → return to THAT page

  instead of always going to /shop.
*/

const previousPage =
  document.referrer;


/*
  Only return to the referrer if it
  actually came from your Canva site.
*/

if (
  previousPage &&
  previousPage.startsWith(
    "https://wallform.my.canva.site/"
  )
) {

  window.location.replace(
    previousPage
  );

} else {

  /*
    Fallback if no valid referrer
    is available.
  */

  window.location.replace(
    "https://wallform.my.canva.site/shop"
  );

}

</script>

</body>
</html>
