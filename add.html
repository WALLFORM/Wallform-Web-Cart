<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WALLFORM</title>
</head>

<body>

<script>

const params = new URLSearchParams(window.location.search);
const code = params.get("add");


/* =========================
   VALID PRODUCTS
========================= */

const validProducts = [
  "WF-001",
  "WF-002",
  "WF-003",
  "WF-004",
  "WF-005",
  "WF-006",
  "WF-007"
];


/* =========================
   GET CART
========================= */

function getCart() {

  try {

    const saved = localStorage.getItem("wallformCart");

    if (!saved) {
      return {};
    }

    const parsed = JSON.parse(saved);

    if (Array.isArray(parsed)) {

      const converted = {};

      parsed.forEach(item => {

        converted[item] =
          (converted[item] || 0) + 1;

      });

      return converted;
    }

    if (
      parsed &&
      typeof parsed === "object"
    ) {
      return parsed;
    }

    return {};

  } catch (error) {

    return {};

  }

}


/* =========================
   SAVE CART
========================= */

function saveCart(cart) {

  localStorage.setItem(
    "wallformCart",
    JSON.stringify(cart)
  );

}


/* =========================
   ADD PRODUCT
========================= */

if (validProducts.includes(code)) {

  const cart = getCart();

  cart[code] =
    (Number(cart[code]) || 0) + 1;

  saveCart(cart);

}


/* =========================
   OPEN CART
========================= */

window.location.replace(
  "https://wallform.github.io/Wallform-Web-Cart/cart.html"
);

</script>

</body>
</html>
