<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — WALLFORM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #000; color: #fff;
      font-family: Arial, Helvetica, sans-serif; padding: 30px 20px;
    }
    .cart-container { max-width: 600px; margin: auto; }
    h1 { font-size: 32px; margin-bottom: 30px; letter-spacing: 1px; }
    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      border: 1px solid #333; padding: 15px; margin-bottom: 15px;
    }
    .item-details { display: flex; flex-direction: column; }
    .item-name { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
    .item-price { font-size: 14px; color: #aaa; }
    .controls { display: flex; align-items: center; gap: 15px; }
    .btn {
      background: #222; color: #fff; border: 1px solid #444;
      width: 35px; height: 35px; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .btn:hover { background: #333; }
    .qty { font-size: 16px; font-weight: bold; width: 20px; text-align: center; }
    
    .checkout-box {
      margin-top: 30px; border-top: 1px solid #333; padding-top: 20px;
    }
    .total-row {
      display: flex; justify-content: space-between; 
      font-size: 20px; font-weight: bold; margin-bottom: 20px;
    }
    .checkout-btn {
      width: 100%; background: #fff; color: #000; border: none;
      padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer;
      letter-spacing: 1px;
    }
    .empty-msg { color: #888; font-size: 16px; font-style: italic; }
  </style>
</head>
<body>

<div class="cart-container">
  <h1>CART</h1>
  <div id="cartItems"></div>
  
  <div class="checkout-box" id="checkoutBox" style="display: none;">
    <div class="total-row">
      <span>Total</span>
      <span id="cartTotal">₹0</span>
    </div>
    <button class="checkout-btn" onclick="window.location.href='checkout.html'">PROCEED TO CHECKOUT</button>
  </div>
</div>

<script>
const products = {
  "WF-002": { name: "Porsche 911 GT3RS Mini", price: 99 },
  "WF-003": { name: "F1 Car Mini", price: 99 },
  "WF-004": { name: "Japanese Scenery Mini", price: 99 },
  "WF-005": { name: "Vintage Race Car Mini", price: 99 },
  "WF-006": { name: "Batmobile Mini", price: 99 },
  "WF-007": { name: "Check Engine Logo", price: 119 },
  "WF-008": { name: "Custom Name Plate", price: 149 },
  "WF-009": { name: "Custom Prints", price: 220 }
};

function getCart() {
  try {
    const saved = localStorage.getItem("wallformCart");
    if (!saved) return {};
    return JSON.parse(saved);
  } catch (e) {
    return {};
  }
}

function saveCart(cart) {
  localStorage.setItem("wallformCart", JSON.stringify(cart));
}

function updateQty(code, change) {
  const cart = getCart();
  const current = Number(cart[code]) || 0;
  const newQty = current + change;
  
  if (newQty <= 0) {
    delete cart[code];
  } else {
    cart[code] = newQty;
  }
  
  saveCart(cart);
  renderCart();
}

function renderCart() {
  const cart = getCart();
  const container = document.getElementById("cartItems");
  const checkoutBox = document.getElementById("checkoutBox");
  const totalEl = document.getElementById("cartTotal");
  
  container.innerHTML = "";
  let total = 0;
  let hasItems = false;

  for (const code in cart) {
    if (!products[code]) continue;
    hasItems = true;
    const qty = cart[code];
    const item = products[code];
    total += item.price * qty;

    const div = document.createElement("div");
    div.className = "cart-item";
    div.innerHTML = `
      <div class="item-details">
        <span class="item-name">${item.name}</span>
        <span class="item-price">₹${item.price} x ${qty}</span>
      </div>
      <div class="controls">
        <button class="btn" onclick="updateQty('${code}', -1)">-</button>
        <span class="qty">${qty}</span>
        <button class="btn" onclick="updateQty('${code}', 1)">+</button>
      </div>
    `;
    container.appendChild(div);
  }

  if (hasItems) {
    checkoutBox.style.display = "block";
    totalEl.textContent = "₹" + total;
  } else {
    checkoutBox.style.display = "none";
    container.innerHTML = "<p class='empty-msg'>Your cart is empty.</p>";
  }
}

renderCart();
</script>
</body>
</html>
