<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>WALLFORM — Cart</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background: #000;

      color: #fff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    .container {

      max-width: 700px;

      margin: 0 auto;

      padding: 50px 25px;

    }


    .logo {

      font-size: 28px;

      font-weight: 800;

      letter-spacing: 3px;

      margin-bottom: 5px;

    }


    .tagline {

      font-size: 11px;

      letter-spacing: 2px;

      color: #888;

      margin-bottom: 45px;

    }


    h1 {

      font-size: 32px;

      margin: 0 0 30px 0;

    }


    .item {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      padding: 20px 0;

      border-bottom: 1px solid #333;

    }


    .item-info {

      flex: 1;

      min-width: 0;

    }


    .item-name {

      font-size: 16px;

      font-weight: 600;

    }


    .item-code {

      font-size: 12px;

      color: #888;

      margin-top: 5px;

    }


    .item-right {

      display: flex;

      align-items: center;

      gap: 20px;

    }


    /* =========================
       QUANTITY
    ========================= */

    .quantity-control {

      display: flex;

      align-items: center;

      height: 42px;

      border: 1px solid #555;

    }


    .quantity-button {

      width: 42px;

      height: 40px;

      padding: 0;

      margin: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #000;

      color: #fff;

      border: none;

      font-size: 24px;

      cursor: pointer;

      user-select: none;

    }


    .quantity-button:hover {

      background: #fff;

      color: #000;

    }


    .quantity-number {

      width: 42px;

      height: 40px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-left: 1px solid #555;

      border-right: 1px solid #555;

      font-size: 15px;

      font-weight: 600;

    }


    .price {

      min-width: 65px;

      text-align: right;

      font-weight: 600;

      white-space: nowrap;

    }


    /* =========================
       TOTAL
    ========================= */

    .total {

      display: flex;

      justify-content: space-between;

      padding: 25px 0;

      font-size: 19px;

      font-weight: 700;

    }


    /* =========================
       BUTTONS
    ========================= */

    button.main-button,
    button.secondary {

      width: 100%;

      padding: 17px;

      margin-top: 10px;

      font-size: 14px;

      font-weight: 700;

      letter-spacing: 1px;

      cursor: pointer;

    }


    .main-button {

      background: #fff;

      color: #000;

      border: 1px solid #fff;

    }


    .main-button:hover {

      background: #ddd;

    }


    .secondary {

      background: #000;

      color: #fff;

      border: 1px solid #444;

    }


    .secondary:hover {

      background: #111;

      border-color: #777;

    }


    .clear {

      color: #666;

      border-color: #222;

      margin-top: 20px !important;

    }


    .clear:hover {

      color: #aaa;

    }


    .empty {

      color: #888;

      line-height: 1.6;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 550px) {

      .container {

        padding: 35px 20px;

      }


      .item {

        align-items: flex-start;

      }


      .item-right {

        flex-direction: column;

        align-items: flex-end;

        gap: 10px;

      }


      .item-name {

        font-size: 15px;

      }


      .price {

        min-width: auto;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <div class="logo">
    WALLFORM
  </div>


  <div class="tagline">
    DECOR YOUR WAY.
  </div>


  <h1>
    Your Cart
  </h1>


  <div id="cart"></div>


</div>


<script>


/* =========================
   PRODUCTS
========================= */

const products = {

  "WF-001": {
    name: "911 GT3 RS",
    price: 69
  },

  "WF-002": {
    name: "F1 Stand",
    price: 99
  },

  "WF-003": {
    name: "Japanese Escape",
    price: 89
  },

  "WF-004": {
    name: "McLaren Logo",
    price: 89
  },

  "WF-005": {
    name: "Mercedes Logo",
    price: 89
  },

  "WF-006": {
    name: "Ferrari Logo",
    price: 79
  },

  "WF-007": {
    name: "MC Sword",
    price: 179
  }

};


/* =========================
   GET CART
========================= */

function getCart() {

  try {

    const saved =
      localStorage.getItem("wallformCart");

    if (!saved) {
      return {};
    }

    const parsed =
      JSON.parse(saved);


    if (Array.isArray(parsed)) {

      const converted = {};

      parsed.forEach(code => {

        converted[code] =
          (converted[code] || 0) + 1;

      });

      return converted;

    }


    if (
      parsed &&
      typeof parsed === "object"
    ) {

      return parsed;

    }


    return {};

  } catch (error) {

    return {};

  }

}


/* =========================
   SAVE CART
========================= */

function saveCart(cart) {

  localStorage.setItem(
    "wallformCart",
    JSON.stringify(cart)
  );

}


/* =========================
   CLEAR CART
========================= */

function removeCart() {

  localStorage.removeItem(
    "wallformCart"
  );

}


/* =========================
   CART
========================= */

let cart = getCart();

const cartElement =
  document.getElementById("cart");


/* =========================
   RENDER
========================= */

function renderCart() {

  const cartCodes =
    Object.keys(cart).filter(code => {

      return (
        products[code] &&
        Number(cart[code]) > 0
      );

    });


  /* =========================
     EMPTY
  ========================= */

  if (cartCodes.length === 0) {

    cartElement.innerHTML = `

      <div class="empty">
        Your cart is empty.
      </div>

      <button
        type="button"
        class="secondary"
        onclick="closeCart()">

        CONTINUE SHOPPING

      </button>

    `;

    return;

  }


  let total = 0;

  let html = "";


  /* =========================
     ITEMS
  ========================= */

  cartCodes.forEach(code => {

    const product =
      products[code];

    const quantity =
      Number(cart[code]);


    const itemTotal =
      product.price * quantity;


    total += itemTotal;


    html += `

      <div class="item">


        <div class="item-info">

          <div class="item-name">
            ${product.name}
          </div>

          <div class="item-code">
            ${code}
          </div>

        </div>


        <div class="item-right">


          <div class="quantity-control">


            <button
              type="button"
              class="quantity-button"
              onclick="changeQuantity('${code}', -1)">

              −

            </button>


            <div class="quantity-number">

              ${quantity}

            </div>


            <button
              type="button"
              class="quantity-button"
              onclick="changeQuantity('${code}', 1)">

              +

            </button>


          </div>


          <div class="price">

            ₹${itemTotal}

          </div>


        </div>


      </div>

    `;

  });


  /* =========================
     TOTAL + BUTTONS
  ========================= */

  html += `

    <div class="total">

      <span>
        Product Total
      </span>

      <span>
        ₹${total}
      </span>

    </div>


    <button
      type="button"
      class="main-button"
      onclick="placeOrder()">

      PLACE ORDER

    </button>


    <button
      type="button"
      class="secondary"
      onclick="closeCart()">

      CONTINUE SHOPPING

    </button>


    <button
      type="button"
      class="secondary clear"
      onclick="clearCart()">

      CLEAR CART

    </button>

  `;


  cartElement.innerHTML =
    html;

}


/* =========================
   QUANTITY
========================= */

function changeQuantity(code, amount) {

  if (!products[code]) {
    return;
  }


  const current =
    Number(cart[code] || 0);


  const newQuantity =
    current + amount;


  if (newQuantity <= 0) {

    delete cart[code];

  } else {

    cart[code] =
      newQuantity;

  }


  saveCart(cart);

  renderCart();

}


/* =========================
   WHATSAPP
========================= */

function placeOrder() {

  const cartCodes =
    Object.keys(cart).filter(code => {

      return (
        products[code] &&
        Number(cart[code]) > 0
      );

    });


  if (cartCodes.length === 0) {
    return;
  }


  let message =
    "Hi WALLFORM! I'd like to place an order:\n\n";


  let total = 0;


  cartCodes.forEach(code => {

    const product =
      products[code];

    const quantity =
      Number(cart[code]);


    if (quantity > 1) {

      message +=
        product.name +
        " " +
        code +
        " (x" +
        quantity +
        ")\n";

    } else {

      message +=
        product.name +
        " " +
        code +
        "\n";

    }


    total +=
      product.price * quantity;

  });


  message +=
    "\nProduct total: ₹" +
    total +
    "\n\n" +
    "Please confirm the shipping cost and payment details.";


  const encodedMessage =
    encodeURIComponent(message);


  window.location.href =
    "https://wa.me/918500670741?text=" +
    encodedMessage;

}


/* =========================
   CLOSE CART
========================= */

function closeCart() {

  /*
    Do NOT redirect anywhere.

    Just close this cart tab.
  */

  window.close();

}


/* =========================
   CLEAR CART
========================= */

function clearCart() {

  removeCart();

  cart = {};

  renderCart();

}


/* =========================
   START
========================= */

renderCart();


</script>


</body>

</html>
