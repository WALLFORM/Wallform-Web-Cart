<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WALLFORM — Cart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 50px 25px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 5px;
    }

    .tagline {
      font-size: 11px;
      letter-spacing: 2px;
      color: #888;
      margin-bottom: 45px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid #333;
      gap: 20px;
    }

    .item-name {
      font-size: 16px;
      font-weight: 600;
    }

    .item-code {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }

    .quantity {
      color: #aaa;
      font-size: 13px;
      margin-top: 5px;
    }

    .price {
      font-weight: 600;
      white-space: nowrap;
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 19px;
      font-weight: 700;
      padding: 25px 0;
    }

    button {
      width: 100%;
      padding: 17px;
      border: 1px solid #fff;
      background: #fff;
      color: #000;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #ddd;
    }

    .secondary {
      background: #000;
      color: #fff;
      border: 1px solid #444;
    }

    .secondary:hover {
      background: #111;
      border-color: #777;
    }

    .clear {
      margin-top: 20px;
      background: #000;
      color: #666;
      border-color: #222;
    }

    .clear:hover {
      background: #111;
      color: #aaa;
    }

    .empty {
      color: #888;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">WALLFORM</div>
  <div class="tagline">DECOR YOUR WAY.</div>

  <h1>Your Cart</h1>

  <div id="cart"></div>

</div>


<script>

const products = {

  "WF-001": {
    name: "911 GT3 RS Wall Decor",
    price: 100
  },

  "WF-002": {
    name: "F1 Stand",
    price: 100
  },

  "WF-003": {
    name: "Japanese Escape",
    price: 100
  },

  "WF-004": {
    name: "McLaren Logo",
    price: 100
  }

};


function getCart() {

  try {

    const saved =
      localStorage.getItem("wallformCart");

    if (!saved) {
      return {};
    }

    const parsed = JSON.parse(saved);

    // Support the old cart format too
    if (Array.isArray(parsed)) {

      const converted = {};

      parsed.forEach(code => {
        converted[code] =
          (converted[code] || 0) + 1;
      });

      return converted;
    }

    return parsed &&
      typeof parsed === "object"
      ? parsed
      : {};

  } catch (error) {

    return {};

  }

}


function removeCart() {

  try {
    localStorage.removeItem("wallformCart");
  } catch (error) {
    // Storage unavailable
  }

}


const cart = getCart();

const cartElement =
  document.getElementById("cart");


const cartCodes =
  Object.keys(cart).filter(
    code =>
      products[code] &&
      Number(cart[code]) > 0
  );


if (cartCodes.length === 0) {

  cartElement.innerHTML = `

    <div class="empty">
      Your cart is empty.
    </div>

    <button
      class="secondary"
      onclick="goShopping()">
      CONTINUE SHOPPING
    </button>

  `;

} else {

  let total = 0;

  let html = "";


  cartCodes.forEach(code => {

    const product =
      products[code];

    const quantity =
      Number(cart[code]);

    const itemTotal =
      product.price * quantity;

    total += itemTotal;


    html += `

      <div class="item">

        <div>

          <div class="item-name">
            ${product.name}
          </div>

          <div class="item-code">
            ${code}
          </div>

          <div class="quantity">
            Quantity: ${quantity}
          </div>

        </div>

        <div class="price">
          ₹${itemTotal}
        </div>

      </div>

    `;

  });


  html += `

    <div class="total">

      <span>
        Product Total
      </span>

      <span>
        ₹${total}
      </span>

    </div>


    <button onclick="placeOrder()">
      PLACE ORDER
    </button>


    <button
      class="secondary"
      onclick="goShopping()">

      CONTINUE SHOPPING

    </button>


    <button
      class="clear"
      onclick="clearCart()">

      CLEAR CART

    </button>

  `;


  cartElement.innerHTML = html;

}


function placeOrder() {

  let message =
    "Hi WALLFORM! I'd like to place an order:\n\n";


  let total = 0;


  cartCodes.forEach(code => {

    const product =
      products[code];

    const quantity =
      Number(cart[code]);


    message +=
      code +
      " — " +
      product.name +
      " × " +
      quantity +
      "\n";


    total +=
      product.price *
      quantity;

  });


  message +=
    "\nProduct total: ₹" +
    total +
    "\n\n" +
    "Please confirm the shipping cost and payment details.";


  const encodedMessage =
    encodeURIComponent(message);


  window.location.href =
    "https://wa.me/918500670741?text=" +
    encodedMessage;

}


function clearCart() {

  removeCart();

  location.reload();

}


function goShopping() {

  window.location.replace(
    "https://wallform.my.canva.site/shop"
  );

}

</script>

</body>
</html>
