<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WALLFORM — Cart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 50px 25px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 5px;
    }

    .tagline {
      font-size: 11px;
      letter-spacing: 2px;
      color: #888;
      margin-bottom: 45px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid #333;
      gap: 20px;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-size: 16px;
      font-weight: 600;
    }

    .item-code {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      border: 1px solid #444;
      height: 38px;
    }

    .quantity-control button {
      width: 38px;
      height: 36px;
      margin: 0;
      padding: 0;
      border: none;
      background: #000;
      color: #fff;
      font-size: 20px;
      font-weight: 400;
      cursor: pointer;
    }

    .quantity-control button:hover {
      background: #181818;
    }

    .quantity-number {
      width: 38px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }

    .price {
      min-width: 65px;
      text-align: right;
      font-weight: 600;
      white-space: nowrap;
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 19px;
      font-weight: 700;
      padding: 25px 0;
    }

    .main-button {
      width: 100%;
      padding: 17px;
      border: 1px solid #fff;
      background: #fff;
      color: #000;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 10px;
    }

    .main-button:hover {
      background: #ddd;
    }

    .secondary {
      width: 100%;
      padding: 17px;
      margin-top: 10px;
      background: #000;
      color: #fff;
      border: 1px solid #444;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .secondary:hover {
      background: #111;
      border-color: #777;
    }

    .clear {
      margin-top: 20px;
      background: #000;
      color: #666;
      border-color: #222;
    }

    .clear:hover {
      background: #111;
      color: #aaa;
    }

    .empty {
      color: #888;
      line-height: 1.6;
    }

    @media (max-width: 550px) {

      .container {
        padding: 35px 20px;
      }

      .item {
        align-items: flex-start;
      }

      .item-right {
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
      }

      .item-name {
        font-size: 15px;
      }

      .price {
        min-width: auto;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">WALLFORM</div>

  <div class="tagline">
    DECOR YOUR WAY.
  </div>

  <h1>Your Cart</h1>

  <div id="cart"></div>

</div>


<script>

const products = {

  "WF-001": {
    name: "911 GT3 RS Wall Decor",
    price: 100
  },

  "WF-002": {
    name: "F1 Stand",
    price: 100
  },

  "WF-003": {
    name: "Japanese Escape",
    price: 100
  },

  "WF-004": {
    name: "McLaren Logo",
    price: 100
  }

};


/* -------------------------
   CART STORAGE
------------------------- */

function getCart() {

  try {

    const saved =
      localStorage.getItem("wallformCart");

    if (!saved) {
      return {};
    }

    const parsed =
      JSON.parse(saved);

    /*
      Convert the old array-style
      cart into the new quantity format.
    */

    if (Array.isArray(parsed)) {

      const converted = {};

      parsed.forEach(code => {

        converted[code] =
          (converted[code] || 0) + 1;

      });

      return converted;
    }

    return (
      parsed &&
      typeof parsed === "object"
    )
      ? parsed
      : {};

  } catch (error) {

    return {};

  }

}


function saveCart(cart) {

  try {

    localStorage.setItem(
      "wallformCart",
      JSON.stringify(cart)
    );

  } catch (error) {

    // Storage unavailable

  }

}


function removeCart() {

  try {

    localStorage.removeItem(
      "wallformCart"
    );

  } catch (error) {

    // Storage unavailable

  }

}


/* -------------------------
   CART
------------------------- */

let cart = getCart();


const cartElement =
  document.getElementById("cart");


/* -------------------------
   RENDER CART
------------------------- */

function renderCart() {

  const cartCodes =
    Object.keys(cart).filter(code => {

      return (
        products[code] &&
        Number(cart[code]) > 0
      );

    });


  /*
    Empty cart
  */

  if (cartCodes.length === 0) {

    cartElement.innerHTML = `

      <div class="empty">
        Your cart is empty.
      </div>

      <button
        class="secondary"
        onclick="goShopping()">

        CONTINUE SHOPPING

      </button>

    `;

    return;
  }


  let total = 0;

  let html = "";


  /*
    Products
  */

  cartCodes.forEach(code => {

    const product =
      products[code];

    const quantity =
      Number(cart[code]);


    const itemTotal =
      product.price * quantity;


    total += itemTotal;


    html += `

      <div class="item">

        <div class="item-info">

          <div class="item-name">
            ${product.name}
          </div>

          <div class="item-code">
            ${code}
          </div>

        </div>


        <div class="item-right">

          <div class="quantity-control">

            <button
              onclick="changeQuantity('${code}', -1)"
              aria-label="Decrease quantity">

              −

            </button>


            <div class="quantity-number">

              ${quantity}

            </div>


            <button
              onclick="changeQuantity('${code}', 1)"
              aria-label="Increase quantity">

              +

            </button>

          </div>


          <div class="price">

            ₹${itemTotal}

          </div>

        </div>

      </div>

    `;

  });


  /*
    Bottom section
  */

  html += `

    <div class="total">

      <span>
        Product Total
      </span>

      <span>
        ₹${total}
      </span>

    </div>


    <button
      class="main-button"
      onclick="placeOrder()">

      PLACE ORDER

    </button>


    <button
      class="secondary"
      onclick="goShopping()">

      CONTINUE SHOPPING

    </button>


    <button
      class="secondary clear"
      onclick="clearCart()">

      CLEAR CART

    </button>

  `;


  cartElement.innerHTML = html;

}


/* -------------------------
   PLUS / MINUS
------------------------- */

function changeQuantity(code, amount) {

  if (!products[code]) {
    return;
  }


  const currentQuantity =
    Number(cart[code] || 0);


  const newQuantity =
    currentQuantity + amount;


  /*
    If quantity reaches zero,
    remove the product.
  */

  if (newQuantity <= 0) {

    delete cart[code];

  } else {

    cart[code] = newQuantity;

  }


  saveCart(cart);

  renderCart();

}


/* -------------------------
   WHATSAPP CHECKOUT
------------------------- */

function placeOrder() {

  const cartCodes =
    Object.keys(cart).filter(code => {

      return (
        products[code] &&
        Number(cart[code]) > 0
      );

    });


  if (cartCodes.length === 0) {
    return;
  }


  let message =
    "Hi WALLFORM! I'd like to place an order:\n\n";


  let total = 0;


  cartCodes.forEach(code => {

    const product =
      products[code];

    const quantity =
      Number(cart[code]);


    /*
      Quantity appears only
      when more than one is ordered.
    */

    if (quantity > 1) {

      message +=
        product.name +
        " " +
        code +
        " (x" +
        quantity +
        ")\n";

    } else {

      message +=
        product.name +
        " " +
        code +
        "\n";

    }


    total +=
      product.price *
      quantity;

  });


  message +=
    "\nProduct total: ₹" +
    total +
    "\n\n" +
    "Please confirm the shipping cost and payment details.";


  /*
    Encode the COMPLETE message
    safely for WhatsApp.
  */

  const encodedMessage =
    encodeURIComponent(message);


  window.location.href =
    "https://wa.me/918500670741?text=" +
    encodedMessage;

}


/* -------------------------
   OTHER BUTTONS
------------------------- */

function clearCart() {

  removeCart();

  cart = {};

  renderCart();

}


function goShopping() {

  /*
    Replace the cart page with
    your actual WALLFORM shop.
  */

  window.location.replace(
    "https://wallform.my.canva.site/shop"
  );

}


/* -------------------------
   INITIAL LOAD
------------------------- */

renderCart();

</script>

</body>
</html>
